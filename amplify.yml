# AWS Amplify Hosting build settings for the Astro static site.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node version comes from .nvmrc (Astro 7 needs >= 22.23.4).
        - nvm install
        - nvm use
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
